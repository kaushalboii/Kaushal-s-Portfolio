<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <style>
      :root {
        --bg: #1A1818;
        --fg: #E8E4E0;
        --border: rgba(232, 228, 224, 0.15);
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #F3EEEC;
          --fg: #1A1818;
          --border: rgba(26, 24, 24, 0.12);
        }
      }
    </style>
  </defs>
  <rect width="64" height="64" rx="15" fill="var(--bg)" stroke="var(--border)" stroke-width="1.5"/>
  <text x="32" y="38" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Onest', 'SF Pro Display', system-ui, sans-serif" font-weight="800" font-size="34" fill="var(--fg)" letter-spacing="-1">K.</text>
</svg>
